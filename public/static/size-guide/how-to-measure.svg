<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <rect x="0" y="0" width="400" height="560" fill="#faf6ef" />

  <!-- figure silhouette -->
  <g fill="none" stroke="#1c1815" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- head -->
    <circle cx="180" cy="56" r="26" />
    <!-- neck -->
    <path d="M168 80 L168 94 Q180 104 192 94 L192 80" />
    <!-- shoulders to sleeve/hem silhouette (dress) -->
    <path d="M140 108
             Q116 116 108 150
             L100 250
             Q140 262 180 262
             Q220 262 260 250
             L252 150
             Q244 116 220 108
             Q180 96 140 108 Z" fill="#e2d5b8" fill-opacity="0.35" />
    <!-- torso center seam -->
    <path d="M180 108 L180 262" stroke-opacity="0.4" />
    <!-- dress skirt flaring to hem -->
    <path d="M104 258 L70 500 Q180 522 290 500 L256 258" fill="#e2d5b8" fill-opacity="0.2" />
  </g>

  <!-- measurement guide lines -->
  <g stroke="#b1873f" stroke-width="1.6" stroke-dasharray="5 4">
    <!-- shoulder -->
    <line x1="118" y1="112" x2="242" y2="112" />
    <!-- bust -->
    <line x1="100" y1="160" x2="260" y2="160" />
    <!-- waist -->
    <line x1="104" y1="215" x2="256" y2="215" />
    <!-- hips -->
    <line x1="94" y1="262" x2="266" y2="262" />
    <!-- sleeve length (shoulder to wrist along the side) -->
    <line x1="112" y1="112" x2="88" y2="250" />
    <!-- dress length (shoulder to hem) -->
    <line x1="248" y1="112" x2="284" y2="500" />
  </g>

  <!-- labels + leader lines -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#3a332c">
    <line x1="242" y1="112" x2="300" y2="112" stroke="#3a332c" stroke-width="1" />
    <text x="305" y="117">Shoulder</text>

    <line x1="260" y1="160" x2="300" y2="160" stroke="#3a332c" stroke-width="1" />
    <text x="305" y="165">Bust</text>

    <line x1="256" y1="215" x2="300" y2="215" stroke="#3a332c" stroke-width="1" />
    <text x="305" y="220">Waist</text>

    <line x1="266" y1="262" x2="300" y2="262" stroke="#3a332c" stroke-width="1" />
    <text x="305" y="267">Hips</text>

    <line x1="88" y1="250" x2="30" y2="330" stroke="#3a332c" stroke-width="1" />
    <text x="8" y="345" text-anchor="start">Sleeve</text>
    <text x="8" y="363" text-anchor="start">Length</text>

    <line x1="284" y1="500" x2="300" y2="500" stroke="#3a332c" stroke-width="1" />
    <text x="305" y="505">Dress</text>
    <text x="305" y="523">Length</text>
  </g>
</svg>
